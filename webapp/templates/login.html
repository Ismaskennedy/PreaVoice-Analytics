{% extends "base.html" %}
{% block title %}Entrar — PREA Voice Analytics{% endblock %}
{% block content %}
<div class="centrado">
    <img class="logo-login" src="/static/logo.png" alt="PREA Centro de Contacto">
    <h1>PREA Voice Analytics</h1>
    <p class="vacio">Entra con tu correo y contraseña.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form class="tarjeta" action="/login" method="post">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required autofocus>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
