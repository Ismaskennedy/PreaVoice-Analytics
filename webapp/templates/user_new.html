{% extends "base.html" %}
{% block title %}Nuevo usuario — PREA Voice Analytics{% endblock %}
{% block content %}
    <a class="volver" href="/users">&larr; Volver a usuarios</a>
    <h1>Nuevo usuario</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form class="tarjeta" action="/users" method="post">
        <label for="full_name">Nombre completo</label>
        <input type="text" id="full_name" name="full_name" required>

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <label for="role">Rol</label>
        <select id="role" name="role" required>
            <option value="agente">Agente</option>
            <option value="calidad">Calidad</option>
            <option value="admin">Administrador</option>
        </select>

        <label for="external_code">Código externo (opcional, para cruzar con el CSV de carga por lotes)</label>
        <input type="text" id="external_code" name="external_code">

        <button type="submit">Crear usuario</button>
    </form>
{% endblock %}
