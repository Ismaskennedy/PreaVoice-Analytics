[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "prea-voice-analytics"
version = "0.1.0"
description = "PREA Voice Analytics — plataforma de analisis de llamadas para contact centers de cobranza en Mexico"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.19",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openai>=2.0",
    "itsdangerous>=2.2",
    "xhtml2pdf>=0.2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
